# Product layer over @deepseek-ai/dsh-web-app. These are additive browser
# plugins: character owns packs/settings/TTS/progression; shell only replaces
# layout.frame and falls back to the official AppFrame when unloaded.
- insert:
    - id: lumi-character
      name: '@dsh-lumi/client-character'

    - id: lumi-shell
      name: '@dsh-lumi/client-shell'
