<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
    <title>DeepSeek Harness · Lumi</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #294158; background: radial-gradient(circle at 45% 20%, #fff 0, #edf6fd 38%, #dbeaf7 100%); }
      body::before, body::after { content: ""; position: fixed; border-radius: 999px; filter: blur(16px); opacity: .6; }
      body::before { width: 42vw; height: 42vw; left: -10vw; bottom: -24vw; background: #c8dcff; }
      body::after { width: 38vw; height: 38vw; right: -15vw; top: -24vw; background: #f3cfe1; }
      .titlebar { position: fixed; z-index: 10; inset: 0 0 auto; height: 44px; display: flex; align-items: center; justify-content: space-between; padding-left: 14px; border-bottom: 1px solid rgba(78,109,143,.12); background: rgba(255,255,255,.38); backdrop-filter: blur(18px); -webkit-app-region: drag; user-select: none; }
      .titleIdentity { display: flex; align-items: center; gap: 8px; min-width: 0; color: #526d85; font-size: 12px; }
      .titleIdentity strong { color: #294158; }
      .windowActions { align-self: stretch; display: flex; -webkit-app-region: no-drag; }
      .windowActions button { min-width: 46px; height: 100%; padding: 0 14px; border: 0; border-radius: 0; background: transparent; font-size: 15px; }
      .windowActions button:hover { background: rgba(78,109,143,.1); }
      .windowActions .close:hover { color: white; background: #c42b1c; }
      body[data-platform="darwin"] .windowActions { display: none; }
      main { position: relative; width: min(520px, calc(100vw - 48px)); margin-top: 44px; padding: 44px; text-align: center; border: 1px solid rgba(255,255,255,.8); border-radius: 28px; background: rgba(255,255,255,.58); box-shadow: 0 24px 80px rgba(61,104,143,.16); backdrop-filter: blur(24px); }
      .mark { width: 70px; height: 70px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 23px; color: white; font-size: 32px; background: linear-gradient(145deg, #72a8e4, #887bca); box-shadow: 0 14px 32px rgba(75,111,178,.28); }
      h1 { margin: 0; font-size: 24px; font-weight: 680; letter-spacing: .02em; }
      p { min-height: 48px; margin: 14px 0 0; color: #6a7e91; font-size: 14px; line-height: 1.7; }
      .loader { width: 180px; height: 4px; margin: 28px auto 0; overflow: hidden; border-radius: 999px; background: rgba(102,137,168,.15); }
      .loader::after { content: ""; display: block; width: 38%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #68a6dd, #db83b4); animation: travel 1.15s ease-in-out infinite alternate; }
      .actions { display: none; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }
      button { padding: 10px 18px; border: 1px solid rgba(78,109,143,.18); border-radius: 999px; color: #3e5870; font: inherit; cursor: pointer; background: rgba(255,255,255,.72); }
      button.primary { border: 0; color: white; background: linear-gradient(135deg, #5c9bd5, #7a6fc3); }
      button:disabled { cursor: wait; opacity: .55; }
      button:focus-visible { outline: 3px solid #345fb4; outline-offset: 3px; }
      .actionError { display: none; min-height: 0; margin-top: 14px; color: #9e2a2a; }
      .actionError.visible { display: block; }
      body.error .loader { display: none; }
      body.error .actions { display: flex; }
      @keyframes travel { from { transform: translateX(-5%); } to { transform: translateX(170%); } }
      @media (prefers-reduced-motion: reduce) { .loader::after { animation: none; width: 100%; opacity: .6; } }
    </style>
  </head>
  <body>
    <header class="titlebar">
      <div class="titleIdentity"><strong>Lumi</strong><span id="version"></span></div>
      <div class="windowActions">
        <button id="minimize" type="button">—</button>
        <button id="maximize" type="button">□</button>
        <button id="close" class="close" type="button">×</button>
      </div>
    </header>
    <main aria-labelledby="product-title">
      <div class="mark" aria-hidden="true">鲸</div>
      <h1 id="product-title">Lumi</h1>
      <p id="status" role="status" aria-live="polite">Starting Harness and Lumi…</p>
      <div class="loader" aria-hidden="true"></div>
      <div class="actions">
        <button id="restart" class="primary" type="button">Retry</button>
        <button id="copy" type="button">Copy diagnostics</button>
        <button id="logs" type="button">Open logs</button>
      </div>
      <p id="action-error" class="actionError" role="alert"></p>
    </main>
    <script>
      const query = new URLSearchParams(location.search)
      const copy = query.get('locale') === 'zh' ? {
        lang: 'zh-CN', loading: '正在启动 Harness 与 Lumi…', failed: 'Harness 启动失败，请使用下面的恢复操作。',
        retry: '重试', restarting: '正在重新启动…', diagnostics: '复制诊断信息', copied: '已复制', logs: '打开日志',
        minimize: '最小化', maximize: '最大化', restore: '还原', close: '关闭', actionFailed: '操作失败，请重试或打开日志查看详情。',
        noDiagnostics: '没有可用的诊断信息。',
      } : {
        lang: 'en', loading: 'Starting Harness and Lumi…', failed: 'Harness could not start. Use the recovery actions below.',
        retry: 'Retry', restarting: 'Restarting…', diagnostics: 'Copy diagnostics', copied: 'Copied', logs: 'Open logs',
        minimize: 'Minimize', maximize: 'Maximize', restore: 'Restore', close: 'Close', actionFailed: 'The action failed. Try again or open the logs for details.',
        noDiagnostics: 'No diagnostics were provided.',
      }
      document.documentElement.lang = copy.lang
      document.body.dataset.platform = window.dshDesktop?.platform || 'linux'
      document.querySelector('#version').textContent = window.dshDesktop?.appVersion ? `v${window.dshDesktop.appVersion}` : ''
      const error = query.get('mode') === 'error'
      const detail = query.get('detail')
      const diagnostics = query.get('diagnostics') || detail || copy.noDiagnostics
      document.querySelector('#status').textContent = detail || copy.loading
      document.querySelector('#restart').textContent = copy.retry
      document.querySelector('#copy').textContent = copy.diagnostics
      document.querySelector('#logs').textContent = copy.logs
      document.querySelector('#minimize').setAttribute('aria-label', copy.minimize)
      document.querySelector('#maximize').setAttribute('aria-label', copy.maximize)
      document.querySelector('#close').setAttribute('aria-label', copy.close)
      if (error) {
        document.body.classList.add('error')
        document.querySelector('#status').textContent = detail || copy.failed
      }
      const actionError = document.querySelector('#action-error')
      const showActionError = () => { actionError.textContent = copy.actionFailed; actionError.classList.add('visible') }
      const run = async (button, operation) => {
        actionError.classList.remove('visible')
        button.disabled = true
        try { await operation() } catch { showActionError(); button.disabled = false }
      }
      document.querySelector('#restart').addEventListener('click', async event => {
        const button = event.currentTarget
        await run(button, async () => {
          if (!window.dshDesktop) throw new Error('desktop bridge unavailable')
          button.textContent = copy.restarting
          await window.dshDesktop.app.restartHarness()
        })
      })
      document.querySelector('#copy').addEventListener('click', async event => {
        const button = event.currentTarget
        await run(button, async () => {
          try {
            await navigator.clipboard.writeText(diagnostics)
          } catch {
            const textarea = document.createElement('textarea')
            textarea.value = diagnostics
            textarea.style.position = 'fixed'
            textarea.style.opacity = '0'
            document.body.append(textarea)
            textarea.select()
            const copied = document.execCommand('copy')
            textarea.remove()
            if (!copied) throw new Error('Diagnostics could not be copied.')
          }
          button.textContent = copy.copied
          button.disabled = false
        })
      })
      document.querySelector('#logs').addEventListener('click', async event => {
        const button = event.currentTarget
        await run(button, async () => {
          if (!window.dshDesktop) throw new Error('desktop bridge unavailable')
          await window.dshDesktop.app.openLogsFolder()
          button.disabled = false
        })
      })
      document.querySelector('#minimize').addEventListener('click', async () => window.dshDesktop?.window.minimize())
      document.querySelector('#maximize').addEventListener('click', async () => window.dshDesktop?.window.toggleMaximize())
      document.querySelector('#close').addEventListener('click', async () => window.dshDesktop?.window.close())
      const updateMaximize = state => {
        const button = document.querySelector('#maximize')
        button.textContent = state.maximized ? '❐' : '□'
        button.setAttribute('aria-label', state.maximized ? copy.restore : copy.maximize)
      }
      window.dshDesktop?.window.getState().then(updateMaximize).catch(showActionError)
      window.dshDesktop?.window.onStateChanged(updateMaximize)
    </script>
  </body>
</html>
